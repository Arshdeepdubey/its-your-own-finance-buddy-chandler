# ===================================================================
# Server & Graceful Shutdown Settings
# ===================================================================
server.port=8080
server.shutdown=graceful

# ===================================================================
# Spring Core & Lifecycle Settings
# ===================================================================
spring.application.name=finance-secret-service
spring.lifecycle.timeout-per-shutdown-phase=30s

# ===================================================================
# AWS Configuration
# ===================================================================
aws.region=${AWS_REGION:us-east-1}
aws.secretsmanager.endpoint=${AWS_SECRETSMANAGER_ENDPOINT:}

# Optional explicit credentials only when not using IAM/role-based auth.
# aws.access-key-id=${AWS_ACCESS_KEY_ID:}
# aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:}

# ===================================================================
# Database Connection Settings (Oracle)
# ===================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:dev_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change-me}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ===================================================================
# Hibernate & JPA Configuration
# ===================================================================
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===================================================================
# Spring Boot Actuator & Health Probes Configuration
# ===================================================================
# Expose health, info, and prometheus endpoints via HTTP
management.endpoints.web.exposure.include=health,info,prometheus

# Configure health endpoint details and components
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.endpoint.health.probes.enabled=true

# Enable Kubernetes Liveness and Readiness state indicators
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Custom HTTP status code mappings for health states
management.health.status.http-mapping.DOWN=503
management.health.status.http-mapping.OUT_OF_SERVICE=503
management.health.status.http-mapping.FATAL=500

# ===================================================================
# Logging Configuration
# ===================================================================
logging.level.org.springframework.boot.actuate.health=INFO